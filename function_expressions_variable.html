<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript Function</h1>
    <h2> Function Expressions</h2>

    <p>After a function has been stored in a variable,the variable can be used a function:</p>

    <p id="demo"></p>

    <script>

        const multiply = function(a,b) {return a * b};

        let z = multiply(4,3);

        document.getElementById("demo").innerHTML = z;
    </script>
</body>
</html>
