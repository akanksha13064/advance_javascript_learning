<body>
    <h1>Javascript functions</h1>
    <h2>Functions as values</h2>

    <p>x = myFunction(4,3) or x = 12?</p>
    <p>in both cases, x becomes 12.</p>

    <p id="demo"></p>

    <script>

        function myFunction(a,b) {
return a * b;
 }

 const x = myFunction(4,3) ;

 document.getElementById("demo").innerHTML =x;

    
 
    </script>
