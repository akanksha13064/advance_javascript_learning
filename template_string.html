   <script>
    let fname = "Akanksha";
    let lname = "Mali";

    // function definition
    function fullName(fname, lname) {
        return `${fname} ${lname}`;
    }

    // store message in different variable
    let message = `Hello my full name is ${fullName(fname, lname)}`;

    // print with hello msg
    document.write(message + "<br>");

    // print only full name
    document.write(fullName(fname, lname));
</script>
